name: Build and Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild droute.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Ensure Resources directories exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\Resources | Out-Null
          New-Item -ItemType Directory -Force -Path updaterHook\Resources | Out-Null

      - name: Install .NET Framework 4.5 reference assemblies
        shell: pwsh
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDir "$env:RUNNER_TEMP\refasm"

      - name: Build solution
        run: msbuild droute.sln /p:Configuration=Release /p:Platform=x64 /p:RestorePackages=false /p:FrameworkPathOverride="$env:RUNNER_TEMP\refasm\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5" /verbosity:minimal

      - name: Verify build outputs
        shell: pwsh
        run: |
          $errors = @()

          $exe = "installer\bin\Release\droute.exe"
          if (!(Test-Path $exe)) {
            $errors += "droute.exe not found"
          } else {
            Write-Output "droute.exe: $((Get-Item $exe).Length) bytes"
          }

          $native = "installer\Resources\droute_64.dll"
          if (!(Test-Path $native)) {
            $errors += "droute_64.dll not found in installer\Resources"
          } else {
            Write-Output "droute_64.dll: $((Get-Item $native).Length) bytes"
          }

          $hook = Get-Item "installer\Resources\Droute.UpdaterHook.dll" -ErrorAction SilentlyContinue
          if (!$hook) {
            $errors += "Droute.UpdaterHook.dll not found in installer\Resources"
          } elseif ($hook.Length -lt 1MB) {
            $errors += "Droute.UpdaterHook.dll too small (<1MB) — likely not merged"
          } else {
            Write-Output "Droute.UpdaterHook.dll: $($hook.Length) bytes"
          }

          $updaterConfig = "installer\Resources\Update.exe.config"
          if (!(Test-Path $updaterConfig)) {
            $errors += "Update.exe.config not found in installer\Resources"
          } else {
            Write-Output "Update.exe.config: $((Get-Item $updaterConfig).Length) bytes"
          }

          $core = "core\bin\Release\Droute.Core.dll"
          if (!(Test-Path $core)) {
            $errors += "Droute.Core.dll not found in core\bin\Release"
          } else {
            Write-Output "Droute.Core.dll: $((Get-Item $core).Length) bytes"
          }

          $coreDependencies = @(
            "AsmResolver.dll",
            "AsmResolver.PE.dll",
            "AsmResolver.PE.File.dll",
            "MonoMod.Backports.dll",
            "MonoMod.ILHelpers.dll"
          )
          foreach ($dependency in $coreDependencies) {
            $path = Join-Path "core\bin\Release" $dependency
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              $errors += "$dependency not found in core\bin\Release"
            }
          }

          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Error $e }
            exit 1
          }
          Write-Output "All build outputs verified."

      - name: Prepare release archives
        shell: pwsh
        run: |
          $outDir = "release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "installer\bin\Release\droute.exe" -Destination $outDir
          Copy-Item "installer\bin\Release\droute.exe.config" -Destination $outDir -ErrorAction SilentlyContinue
          Get-ChildItem -Path "installer\bin\Release" -Directory | ForEach-Object {
            Copy-Item $_.FullName -Destination "$outDir\$($_.Name)" -Recurse -Force
          }
          Copy-Item "README.md" -Destination $outDir -ErrorAction SilentlyContinue
          Copy-Item "LICENSE.txt" -Destination $outDir -ErrorAction SilentlyContinue
          $zipName = "droute.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zipName -Force
          Write-Output "Created archive: $zipName"

          $libsDir = "release-libs"
          New-Item -ItemType Directory -Force -Path $libsDir | Out-Null
          Copy-Item "installer\Resources\Update.exe.config" -Destination "$libsDir\Update.exe.config"
          Copy-Item "installer\Resources\Droute.UpdaterHook.dll" -Destination "$libsDir\Droute.UpdaterHook.dll"
          Copy-Item "installer\Resources\droute_64.dll" -Destination "$libsDir\droute.dll"
          # Include all managed runtime dependencies produced by the core build.
          Copy-Item "core\bin\Release\*.dll" -Destination $libsDir -ErrorAction Stop

          $libsZipName = "external-libs.zip"
          Compress-Archive -Path "$libsDir\*" -DestinationPath $libsZipName -Force
          Write-Output "Created archive: $libsZipName"

          $releaseNotes = @"
          ## Downloads

          - ``$zipName`` - the installer package. This is exactly what you need for normal installation.
          - ``$libsZipName`` - standalone external libraries for custom integrations.
          "@
          Set-Content -Path "release-notes.md" -Value $releaseNotes -Encoding UTF8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: droute-build
          path: |
            droute.zip
            external-libs.zip
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            droute.zip
            external-libs.zip
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
